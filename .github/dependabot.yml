version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "14:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 3
    # "deps:" type routes commits into release-please's Dependency Updates
    # changelog section; actions/pre-commit bumps stay hidden as "ci".
    commit-message:
      prefix: "deps"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "15:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # pre-commit hooks
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      pre-commit:
        patterns:
          - "*"
