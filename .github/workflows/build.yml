name: Build

# Reusable: tests, audits and builds a tag, uploading the dists as the
# "dist" artifact. Publishing stays in the calling workflow, so PyPI's
# trusted publisher and attestation both see that one workflow.
on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run mypy
        run: mypy certbot_dns_poweradmin

      - name: Run tests
        run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # Mirrors .github/workflows/audit.yml: resolve a real end-user install
      # and audit it, so a known-vulnerable dependency set cannot reach PyPI.
      - name: Resolve runtime dependencies
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --upgrade pip
          .audit-venv/bin/pip install .
          .audit-venv/bin/pip freeze --exclude-editable \
            | grep -v '^certbot-dns-poweradmin' > runtime-requirements.txt
          cat runtime-requirements.txt

      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --requirement runtime-requirements.txt --strict

  build:
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # Tags older than v0.3.4 lack the pin file; build those unpinned.
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          if [ -f .github/requirements-build.txt ]; then
            export PIP_CONSTRAINT=.github/requirements-build.txt
            pip install -r "$PIP_CONSTRAINT"
          else
            pip install build
          fi
          python -m build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
