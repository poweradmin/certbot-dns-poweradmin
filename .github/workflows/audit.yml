name: Audit

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # The plugin declares open-ended floors (acme>=, certbot>=, requests>=),
      # so dependabot never raises a PR for them. Resolve a real end-user
      # install instead and audit the versions pip actually picks.
      - name: Resolve runtime dependencies
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --upgrade pip
          .audit-venv/bin/pip install .
          .audit-venv/bin/pip freeze --exclude-editable \
            | grep -v '^certbot-dns-poweradmin' > runtime-requirements.txt
          cat runtime-requirements.txt

      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --requirement runtime-requirements.txt --strict
